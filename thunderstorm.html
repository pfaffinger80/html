<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thunderstorm Survival</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #020617;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100%;
            max-height: 900px;
            background: #000000;
            border-left: 1px solid #1e293b;
            border-right: 1px solid #1e293b;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 5;
        }
        .header-title {
            font-size: 9px;
            letter-spacing: 1.2px;
            color: #64748b;
            text-transform: uppercase;
        }
        .game-title {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #f8fafc;
        }
        .stats-box {
            text-align: right;
        }
        .stat-value {
            font-size: 14px;
            font-weight: bold;
            color: #38bdf8;
            font-family: monospace;
        }
        #gameover-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 7, 18, 0.92);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .score-summary {
            font-size: 15px;
            color: #94a3b8;
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.6;
            font-family: monospace;
        }
        .btn-restart {
            background: #ffffff;
            color: #030712;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(255, 255, 255, 0.3);
            transition: transform 0.1s;
        }
        .btn-restart:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui-overlay">
        <div>
            <div class="game-title">THUNDERSTORM by Pf@ff ⚡</div>
        </div>
        <div class="stats-box">
            <div class="header-title">Zeit &nbsp;&nbsp;&nbsp;&nbsp; Punkte</div>
            <div><span id="time-val" class="stat-value">00.0</span> &nbsp; <span id="score-val" class="stat-value">0</span></div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <div id="gameover-screen">
        <div id="final-stats" class="score-summary">
            TIME SURVIVED: 00.0<br>
            FINAL SCORE: 0<br>
            MAX LEVEL: 1
        </div>
        <button class="btn-restart" onclick="restartGame()">RESTART</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    const timeValEl = document.getElementById('time-val');
    const scoreValEl = document.getElementById('score-val');
    const gameoverScreen = document.getElementById('gameover-screen');
    const finalStatsEl = document.getElementById('final-stats');

    function resize() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let isPlaying = true;
    let startTime = Date.now();
    let survivalTime = 0;
    let score = 0;
    let level = 1;
    
    const player = {
        x: canvas.width / 2,
        y: canvas.height - 140,
        radius: 12
    };

    let lightnings = [];
    let spawnTimer = 0;
    let lineScrollOffset = 0;

    const keys = { left: false, right: false };

    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
        if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    });

    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
        if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    });

    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        player.x = e.touches[0].clientX - canvas.getBoundingClientRect().left;
    }, { passive: false });

    function createLightning() {
        const startX = Math.random() * (canvas.width - 60) + 30;
        const startY = 0;
        const endY = canvas.height;
        const segments = 12;
        const pts = [];
        
        let currentX = startX;
        pts.push({ x: currentX, y: startY });

        for (let i = 1; i < segments; i++) {
            const y = startY + (endY - startY) * (i / segments);
            currentX += (Math.random() - 0.5) * 55;
            pts.push({ x: currentX, y: y });
        }
        pts.push({ x: currentX, y: endY });

        lightnings.push({
            pts: pts,
            alpha: 1.0
        });
    }

    function restartGame() {
        lightnings = [];
        score = 0;
        level = 1;
        survivalTime = 0;
        startTime = Date.now();
        isPlaying = true;
        gameoverScreen.style.display = 'none';
        loop();
    }

    function checkCollision() {
        for (let l of lightnings) {
            for (let i = 0; i < l.pts.length - 1; i++) {
                let p1 = l.pts[i];
                let p2 = l.pts[i+1];
                
                let A = player.x - p1.x;
                let B = (player.y - 12) - p1.y;
                let C = p2.x - p1.x;
                let D = p2.y - p1.y;

                let dot = A * C + B * D;
                let lenSq = C * C + D * D;
                let param = -1;
                if (lenSq !== 0) param = dot / lenSq;

                let xx, yy;
                if (param < 0) { xx = p1.x; yy = p1.y; }
                else if (param > 1) { xx = p2.x; yy = p2.y; }
                else { xx = p1.x + param * C; yy = p1.y + param * D; }

                let dx = player.x - xx;
                let dy = (player.y - 12) - yy;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < player.radius + 3) return true;
            }
        }
        return false;
    }

    function update() {
        if (!isPlaying) return;

        const moveSpeed = 7;
        if (keys.left) player.x -= moveSpeed;
        if (keys.right) player.x += moveSpeed;

        player.x = Math.max(player.radius + 15, Math.min(canvas.width - player.radius - 15, player.x));

        survivalTime = (Date.now() - startTime) / 1000;
        timeValEl.innerText = survivalTime.toFixed(1);

        score = Math.floor(survivalTime * 12);
        scoreValEl.innerText = score;
        level = Math.floor(survivalTime / 6) + 1;

        // Fortlaufender Scrolling-Effekt für den Hintergrund
        lineScrollOffset = (lineScrollOffset + 2.5) % 40;

        spawnTimer++;
        let spawnInterval = Math.max(16, 50 - level * 4);
        if (spawnTimer >= spawnInterval) {
            createLightning();
            spawnTimer = 0;
        }

        for (let i = lightnings.length - 1; i >= 0; i--) {
            lightnings[i].alpha -= 0.035;
            if (lightnings[i].alpha <= 0) lightnings.splice(i, 1);
        }

        if (checkCollision()) {
            isPlaying = false;
            finalStatsEl.innerHTML = `TIME SURVIVED: ${survivalTime.toFixed(1)}<br>FINAL SCORE: ${score}<br>MAX LEVEL: ${level}`;
            gameoverScreen.style.display = 'flex';
        }
    }

    // Angepasster Hintergrund und Boden im 1:1 Video-Look
    function drawVideoBackground() {
        // Dunkler Basis-Verlauf
        const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        bgGrad.addColorStop(0, '#020617');
        bgGrad.addColorStop(1, '#020408');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Horizontale Linien (Scrolling)
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.08)';
        ctx.lineWidth = 1;
        const spacing = 40;
        for (let y = -spacing + lineScrollOffset; y < canvas.height + spacing; y += spacing) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.stroke();
        }

        // Vertikale Rasterlinien für das Cyber-Grid
        const vSpacing = 45;
        for (let x = 0; x < canvas.width; x += vSpacing) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
        }

        // Simulierter Bodenbereich unten (sanfter Licht-Gradient)
        const groundGrad = ctx.createLinearGradient(0, canvas.height - 180, 0, canvas.height);
        groundGrad.addColorStop(0, 'rgba(3, 7, 18, 0)');
        groundGrad.addColorStop(1, 'rgba(56, 189, 248, 0.05)');
        ctx.fillStyle = groundGrad;
        ctx.fillRect(0, canvas.height - 180, canvas.width, 180);
    }

    function drawStickman(x, y) {
        ctx.strokeStyle = '#38bdf8';
        ctx.fillStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.shadowBlur = 15;
        ctx.shadowColor = '#38bdf8';

        let headY = y - 26;
        let neckY = y - 16;
        let hipY = y - 6;

        // Kopf
        ctx.beginPath();
        ctx.arc(x, headY, 5, 0, Math.PI * 2);
        ctx.stroke();

        // Körper
        ctx.beginPath();
        ctx.moveTo(x, neckY);
        ctx.lineTo(x, hipY);
        ctx.stroke();

        // Arme
        ctx.beginPath();
        ctx.moveTo(x, neckY + 3);
        ctx.lineTo(x - 9, neckY + 11);
        ctx.moveTo(x, neckY + 3);
        ctx.lineTo(x + 9, neckY + 11);
        ctx.stroke();

        // Beine
        ctx.beginPath();
        ctx.moveTo(x, hipY);
        ctx.lineTo(x - 7, y + 4);
        ctx.moveTo(x, hipY);
        ctx.lineTo(x + 7, y + 4);
        ctx.stroke();

        ctx.shadowBlur = 0;
    }

    function draw() {
        drawVideoBackground();

        // Blitze zeichnen
        for (let l of lightnings) {
            ctx.strokeStyle = `rgba(56, 189, 248, ${l.alpha})`;
            ctx.lineWidth = 3;
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#38bdf8';
            ctx.beginPath();
            for (let i = 0; i < l.pts.length; i++) {
                if (i === 0) ctx.moveTo(l.pts[i].x, l.pts[i].y);
                else ctx.lineTo(l.pts[i].x, l.pts[i].y);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        drawStickman(player.x, player.y);
    }

    function loop() {
        update();
        draw();
        if (isPlaying) {
            requestAnimationFrame(loop);
        }
    }

    loop();
</script>

</body>
</html>
