<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>Pfaff Thunderstorm</title>

  <style>
    :root {
      --glow: 0 0 5px #45eaff, 0 0 14px #128fe7, 0 0 28px #176dcc;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000814;
      color: #d8fbff;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
      user-select: none;
    }

    body {
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at 50% 30%, #0c1e54 0%, #03081e 48%, #00030c 100%);
    }

    #game {
      position: relative;
      width: min(100vw, 56.25vh);
      height: min(177.78vw, 100vh);
      max-width: 540px;
      max-height: 960px;
      overflow: hidden;
      border: 1px solid rgba(83, 233, 255, 0.52);
      border-radius: 8px;
      background: radial-gradient(ellipse at 50% 45%, #10235c 0%, #050c27 50%, #010617 100%);
      box-shadow: inset 0 0 34px #0a4792, 0 0 23px rgba(20, 141, 240, 0.45);
    }

    #game::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(255, 255, 255, 0.027) 0 1px,
        transparent 1px 4px
      );
      mix-blend-mode: screen;
    }

    #stars,
    #field {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .top {
      position: absolute;
      z-index: 5;
      top: 13px;
      left: 15px;
      right: 15px;
      height: 80px;
      border-bottom: 1px solid rgba(108, 235, 255, 0.28);
    }

    .credit {
      color: #8aa9c6;
      font-size: 7px;
      font-weight: bold;
      letter-spacing: 2.4px;
      line-height: 1.45;
    }

    .title {
      position: absolute;
      bottom: 4px;           /* direkt über der Linie */
      left: 0;
      right: 0;
      text-align: center;
      color: #72f4ff;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1.2px;
      line-height: 1;
      text-shadow: var(--glow);
    }

    .title span {
      display: block;
      margin-top: 2px;
      color: #c9fbff;
      font-size: 11px;
      letter-spacing: 3px;
    }

    .stats {
      position: absolute;
      top: 3px;
      right: 0;
      display: flex;
      gap: 15px;
    }

    .stat {
      min-width: 40px;
      text-align: center;
    }

    .stat label {
      display: block;
      margin-bottom: 5px;
      color: #7999b8;
      font-size: 5px;
      letter-spacing: 1px;
    }

    .stat b {
      color: #d6fbff;
      font-size: 20px;
      line-height: 1.2;
      text-shadow: var(--glow);
    }

    .subbar {
      position: absolute;
      z-index: 5;
      top: 97px;
      left: 16px;
      right: 16px;
      height: 21px;
      padding: 7px 10px;
      border: 1px solid rgba(57, 190, 236, 0.22);
      border-radius: 4px;
      color: #87bdd7;
      font-size: 6px;
      letter-spacing: 1px;
    }

    .subbar::before {
      content: "◉";
      margin-right: 6px;
      color: #5cefff;
      font-size: 7px;
    }

    .instructions {
      position: absolute;
      z-index: 5;
      top: 126px;
      width: 100%;
      color: #99b9d4;
      font-size: 6px;
      letter-spacing: 1.2px;
      text-align: center;
    }

    .instructions b {
      color: #d8fbff;
    }

    #levelFlash {
      position: absolute;
      z-index: 7;
      top: 34%;
      width: 100%;
      color: #7df4ff;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 3px;
      pointer-events: none;
      text-align: center;
      text-shadow: var(--glow);
      transition: opacity 0.6s;
    }

    #hint {
      position: absolute;
      z-index: 6;
      bottom: 27px;
      width: 100%;
      color: #9bb8ca;
      font-size: 6px;
      letter-spacing: 1.1px;
      opacity: 0.9;
      text-align: center;
    }

    #overlay {
      position: absolute;
      z-index: 50;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(1, 5, 21, 0.64);
      backdrop-filter: blur(2px);
      text-align: center;
    }

    #overlay.show {
      display: grid;
    }

    .panel {
      width: 80%;
      padding: 27px 16px 22px;
      border: 1px solid rgba(93, 239, 255, 0.65);
      background: linear-gradient(135deg, rgba(5, 21, 58, 0.95), rgba(2, 8, 31, 0.94));
      box-shadow: inset 0 0 25px rgba(30, 137, 227, 0.4), 0 0 25px rgba(54, 226, 255, 0.35);
    }

    .gameover {
      color: #7ef4ff;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 2.5px;
      text-shadow: var(--glow);
    }

    .scoreLabel {
      margin-top: 18px;
      color: #8caecb;
      font-size: 7px;
      letter-spacing: 2.2px;
    }

    .final {
      margin: 6px 0 21px;
      color: #e3fdff;
      font-size: 35px;
      font-weight: 900;
      text-shadow: var(--glow);
    }

    button {
      padding: 11px 26px;
      border: 1px solid #69efff;
      background: rgba(14, 100, 181, 0.3);
      box-shadow: inset 0 0 12px #147bd4, 0 0 14px #2ceaff;
      color: #c9fbff;
      cursor: pointer;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    button:hover {
      background: rgba(39, 170, 235, 0.42);
    }

    @media (max-width: 600px) {
      #game {
        width: 100vw;
        height: 100vh;
        border: none;
        border-radius: 0;
      }

      .top {
        top: calc(13px + env(safe-area-inset-top));
      }

      .subbar {
        top: calc(97px + env(safe-area-inset-top));
      }

      .instructions {
        top: calc(126px + env(safe-area-inset-top));
      }
    }
  </style>
</head>

<body>
  <div id="game">
    <canvas id="stars"></canvas>
    <canvas id="field"></canvas>

    <header class="top">
      <!-- Titel mit Blitz-Emojis, zentriert über der Linie -->
      <div class="title">⚡ Pfaffs THUNDERSTORM ⚡</div>

      <div class="stats">
        <div class="stat">
          <label>LEVEL</label>
          <b id="level">1</b>
        </div>

        <div class="stat">
          <label>TIME</label>
          <b id="time">00:00</b>
        </div>

        <div class="stat">
          <label>SCORE</label>
          <b id="score">0</b>
        </div>

        <div class="stat">
          <label>COMBO</label>
          <b id="combo">x1</b>
        </div>
      </div>
    </header>

    <div id="levelFlash">LEVEL 1</div>

    <div id="overlay">
      <div class="panel">
        <div class="gameover">THUNDERSTRUCK</div>
        <div class="scoreLabel">FINAL SCORE</div>
        <div class="final" id="finalScore">0</div>
        <button id="restart">RESTART</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const game = document.querySelector("#game");
      const canvas = document.querySelector("#field");
      const ctx = canvas.getContext("2d");

      const starsCanvas = document.querySelector("#stars");
      const starsCtx = starsCanvas.getContext("2d");

      const scoreEl = document.querySelector("#score");
      const timeEl = document.querySelector("#time");
      const levelEl = document.querySelector("#level");
      const comboEl = document.querySelector("#combo");

      const overlay = document.querySelector("#overlay");
      const finalScore = document.querySelector("#finalScore");
      const restartButton = document.querySelector("#restart");
      const levelFlash = document.querySelector("#levelFlash");

      let width;
      let height;
      let player;
      let bolt;
      let stars;
      let running;
      let startTime;
      let lastFrame;
      let score;
      let combo;
      let level;

      function resize() {
        const rect = game.getBoundingClientRect();
        const pixelRatio = window.devicePixelRatio || 1;

        width = rect.width;
        height = rect.height;

        for (const item of [canvas, starsCanvas]) {
          item.width = width * pixelRatio;
          item.height = height * pixelRatio;
          item.style.width = width + "px";
          item.style.height = height + "px";
        }

        ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        starsCtx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      }

      function seededRandom(seed, index) {
        const value = Math.sin(seed * 12.9898 + index * 78.233) * 43758.5453;
        return value - Math.floor(value);
      }

      function createBolt() {
        return {
          x: 35 + Math.random() * (width - 70),
          y: 115,
          progress: 0,
          maxLength: height - 165,
          seed: Math.random() * 9999,
          pulse: Math.random() * Math.PI * 2
        };
      }

      function resetGame() {
        resize();

        player = {
          x: width / 2,
          y: height - 55,
          radius: 11
        };

        bolt = createBolt();

        stars = Array.from({ length: 70 }, () => ({
          x: Math.random() * width,
          y: 115 + Math.random() * (height - 220),
          radius: Math.random() * 1.5 + 0.25,
          alpha: Math.random() * 0.65 + 0.1
        }));

        running = true;
        startTime = performance.now();
        lastFrame = startTime;
        score = 0;
        combo = 1;
        level = 1;

        overlay.classList.remove("show");

        levelFlash.textContent = "LEVEL 1";
        levelFlash.style.opacity = "1";

        setTimeout(() => {
          levelFlash.style.opacity = "0";
        }, 1500);

        requestAnimationFrame(gameLoop);
      }

      function movePlayer(x) {
        player.x = Math.max(
          player.radius + 6,
          Math.min(width - player.radius - 6, x)
        );
      }

      game.addEventListener("mousemove", event => {
        if (!running) return;

        const rect = game.getBoundingClientRect();
        movePlayer(event.clientX - rect.left);
      });

      let lastTouchX = null;

      game.addEventListener("touchstart", event => {
        lastTouchX = event.touches[0].clientX;
      }, { passive: true });

      game.addEventListener("touchmove", event => {
        if (!running || lastTouchX === null) return;

        const currentX = event.touches[0].clientX;
        const delta = currentX - lastTouchX;

        movePlayer(player.x + delta * 1.4);
        lastTouchX = currentX;
      }, { passive: true });

      restartButton.addEventListener("click", resetGame);

      window.addEventListener("resize", () => {
        if (!running) return;

        resize();
        player.y = height - 55;
        bolt.maxLength = height - 165;
      });

      function createStraightBoltPath() {
        const points = [];
        const parts = Math.max(2, Math.ceil(bolt.progress / 13));

        let currentX = bolt.x;
        let currentY = bolt.y;

        points.push({
          x: currentX,
          y: currentY
        });

        for (let i = 1; i <= parts; i++) {
          const random = seededRandom(bolt.seed, i);
          const offset = (random - 0.5) * 10;

          currentX = bolt.x + offset;
          currentY = bolt.y + (bolt.progress / parts) * i;

          points.push({
            x: currentX,
            y: currentY
          });
        }

        return points;
      }

      function strokeBolt(points, color, lineWidth, blur, alpha) {
        ctx.save();

        ctx.globalAlpha = alpha;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = color;
        ctx.lineWidth = lineWidth;
        ctx.shadowColor = "#68f5ff";
        ctx.shadowBlur = blur;

        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);

        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(points[i].x, points[i].y);
        }

        ctx.stroke();
        ctx.restore();
      }

      function drawLightning() {
        const points = createStraightBoltPath();

        const flicker =
          0.85 + Math.sin(performance.now() * 0.025 + bolt.pulse) * 0.15;

        strokeBolt(points, "#126bd2", 10, 26, 0.22 * flicker);
        strokeBolt(points, "#46dcff", 4.5, 16, 0.82 * flicker);
        strokeBolt(points, "#f2ffff", 1.4, 7, 1);

        return points[points.length - 1];
      }

      function drawPlayer() {
        ctx.save();

        ctx.strokeStyle = "#c9ffff";
        ctx.shadowColor = "#4feaff";
        ctx.shadowBlur = 13;
        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.arc(player.x, player.y - 18, 5, 0, Math.PI * 2);

        ctx.moveTo(player.x, player.y - 13);
        ctx.lineTo(player.x, player.y + 2);

        ctx.moveTo(player.x - 8, player.y - 5);
        ctx.lineTo(player.x + 7, player.y - 7);

        ctx.moveTo(player.x, player.y + 2);
        ctx.lineTo(player.x - 7, player.y + 13);

        ctx.moveTo(player.x, player.y + 2);
        ctx.lineTo(player.x + 7, player.y + 13);

        ctx.stroke();
        ctx.restore();
      }

      function drawFloor() {
        const horizon = height * 0.66;

        ctx.save();

        ctx.strokeStyle = "rgba(27, 163, 238, 0.23)";
        ctx.lineWidth = 1;

        for (let i = 0; i < 12; i++) {
          const t = i / 12;
          const y = horizon + (height - horizon) * t * t;

          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }

        for (let i = -7; i <= 7; i++) {
          ctx.beginPath();
          ctx.moveTo(width / 2 + i * 9, horizon);
          ctx.lineTo(width / 2 + i * width * 0.18, height);
          ctx.stroke();
        }

        ctx.strokeStyle = "rgba(91, 240, 255, 0.8)";
        ctx.shadowColor = "#32dfff";
        ctx.shadowBlur = 12;

        ctx.beginPath();
        ctx.moveTo(0, height - 42);
        ctx.lineTo(width, height - 42);
        ctx.stroke();

        ctx.restore();
      }

      function drawTip(tip) {
        const pulse = 0.8 + Math.sin(performance.now() * 0.03) * 0.2;

        ctx.save();

        ctx.globalAlpha = 0.16 * pulse;
        ctx.fillStyle = "#75f7ff";
        ctx.shadowColor = "#58f2ff";
        ctx.shadowBlur = 28;

        ctx.beginPath();
        ctx.arc(tip.x, tip.y, 9, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = 0.95;
        ctx.fillStyle = "#f2ffff";

        ctx.beginPath();
        ctx.arc(tip.x, tip.y, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);
        starsCtx.clearRect(0, 0, width, height);

        for (const star of stars) {
          starsCtx.fillStyle = `rgba(115, 215, 255, ${star.alpha})`;
          starsCtx.fillRect(star.x, star.y, star.radius, star.radius);
        }

        drawFloor();

        const tip = drawLightning();
        drawTip(tip);
        drawPlayer();
      }

      function endGame() {
        running = false;
        finalScore.textContent = Math.floor(score).toLocaleString("de-DE");
        overlay.classList.add("show");
      }

      function gameLoop(now) {
        if (!running) return;

        const deltaTime = Math.min(0.04, (now - lastFrame) / 1000);
        lastFrame = now;

        const elapsed = (now - startTime) / 1000;

        level = Math.min(9, 1 + Math.floor(elapsed / 18));

        const buildSpeed = 41 + elapsed * 4.8;

        bolt.progress += buildSpeed * deltaTime;

        if (bolt.progress >= bolt.maxLength) {
          score += 100 * combo;
          combo = Math.min(9, combo + 1);
          bolt = createBolt();
        }

        const tipX = bolt.x;
        const tipY = bolt.y + bolt.progress;

        const distance = Math.hypot(
          player.x - tipX,
          (player.y - 5) - tipY
        );

        if (distance < 25) {
          endGame();
          return;
        }

        score += deltaTime * 12 * combo;

        scoreEl.textContent = Math.floor(score);

        const seconds = Math.floor(elapsed);
        const minutesText = String(Math.floor(seconds / 60)).padStart(2, "0");
        const secondsText = String(seconds % 60).padStart(2, "0");

        timeEl.textContent = `${minutesText}:${secondsText}`;
        levelEl.textContent = level;
        comboEl.textContent = `x${combo}`;

        draw();
        requestAnimationFrame(gameLoop);
      }

      resetGame();
    })();
  </script>
</body>
</html>
