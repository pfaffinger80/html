<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clock Made of Clocks</title>
    <style>
        :root {
            /* Standardgröße für Monitore & Querformat */
            --clock-size: min(50px, 4vw); 
            --digit-gap: calc(var(--clock-size) * 0.2);
            --group-gap: calc(var(--clock-size) * 1.5);
        }

        body {
            background-color: #0f0f0f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh; 
            width: 100vw;
            margin: 0;
            overflow: hidden;
            overscroll-behavior: none; 
        }

        .app {
            display: flex;
            flex-direction: row; /* Standardmäßig nebeneinander */
            justify-content: center;
            align-items: center;
            gap: var(--group-gap);
        }

        /* 📱 ZAUBER-TRICK FÜR DAS IPHONE (Hochformat) */
        @media (max-aspect-ratio: 4/5) {
            :root {
                /* Ziffern werden größer, weil sie jetzt gestapelt sind */
                --clock-size: 13vw; 
                /* Vertikaler Abstand zwischen den Blöcken */
                --group-gap: 6vh; 
            }
            .app {
                /* Stapelt die Gruppen (Stunden, Minuten, Sekunden) untereinander */
                flex-direction: column; 
            }
        }

        .time-group {
            display: flex;
            gap: var(--digit-gap);
        }

        .digit {
            display: grid;
            grid-template-columns: repeat(2, var(--clock-size));
            grid-template-rows: repeat(3, var(--clock-size));
        }

        .clock {
            position: relative;
            width: var(--clock-size);
            height: var(--clock-size);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-sizing: border-box;
        }

        .clock::before, .clock::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: calc(var(--clock-size) * 0.1);
            height: 50%;
            background: #ffffff;
            border-radius: calc(var(--clock-size) * 0.05);
            transform-origin: bottom center;
            margin-left: calc(var(--clock-size) * -0.05);
            margin-top: -50%;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            transform: rotate(var(--angle, 225deg));
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
        }

        .clock::before { --angle: var(--hour-angle, 225deg); }
        .clock::after { --angle: var(--minute-angle, 225deg); }
    </style>
</head>
<body>

    <div class="app">
        <!-- Gruppe 1: Stunden -->
        <div class="time-group">
            <div class="digit" id="h1"></div>
            <div class="digit" id="h2"></div>
        </div>
        
        <!-- Gruppe 2: Minuten -->
        <div class="time-group">
            <div class="digit" id="m1"></div>
            <div class="digit" id="m2"></div>
        </div>
        
        <!-- Gruppe 3: Sekunden -->
        <div class="time-group">
            <div class="digit" id="s1"></div>
            <div class="digit" id="s2"></div>
        </div>
    </div>

    <script>
        const numbers = {
            0: [[90, 180], [270, 180], [0, 180], [0, 180], [0, 90], [0, 270]],
            1: [[225, 225], [180, 180], [225, 225], [0, 180], [225, 225], [0, 0]],
            2: [[90, 90], [270, 180], [90, 180], [0, 270], [0, 90], [270, 270]],
            3: [[90, 90], [270, 180], [90, 90], [270, 180], [90, 90], [0, 270]],
            4: [[180, 180], [180, 180], [0, 90], [0, 180], [225, 225], [0, 0]],
            5: [[90, 180], [270, 270], [0, 90], [270, 180], [90, 90], [0, 270]],
            6: [[90, 180], [270, 270], [0, 180], [270, 180], [0, 90], [0, 270]],
            7: [[90, 90], [270, 180], [225, 225], [0, 180], [225, 225], [0, 0]],
            8: [[90, 180], [270, 180], [90, 180], [270, 180], [0, 90], [0, 270]],
            9: [[90, 180], [270, 180], [0, 90], [0, 180], [90, 90], [0, 270]]
        };

        const digits = document.querySelectorAll('.digit');

        digits.forEach(digit => {
            for(let i = 0; i < 6; i++) {
                const clock = document.createElement('div');
                clock.className = 'clock';
                digit.appendChild(clock);
            }
        });

        function getShortestRotation(current, target) {
            const diff = (target - current) % 360;
            const shortest = diff !== diff % 180 ? (diff < 0 ? diff + 360 : diff - 360) : diff;
            return current + shortest;
        }

        function updateTime() {
            const now = new Date();
            const timeStr = 
                String(now.getHours()).padStart(2, '0') + 
                String(now.getMinutes()).padStart(2, '0') + 
                String(now.getSeconds()).padStart(2, '0');

            digits.forEach((digit, digitIndex) => {
                const num = parseInt(timeStr[digitIndex]);
                const pattern = numbers[num];
                const clocks = digit.querySelectorAll('.clock');

                clocks.forEach((clock, clockIndex) => {
                    let targetHour = pattern[clockIndex][0];
                    let targetMinute = pattern[clockIndex][1];

                    let currentHour = parseFloat(clock.style.getPropertyValue('--hour-angle')) || 225;
                    let currentMinute = parseFloat(clock.style.getPropertyValue('--minute-angle')) || 225;

                    let finalHour = getShortestRotation(currentHour, targetHour);
                    let finalMinute = getShortestRotation(currentMinute, targetMinute);

                    clock.style.setProperty('--hour-angle', `${finalHour}deg`);
                    clock.style.setProperty('--minute-angle', `${finalMinute}deg`);
                });
            });
        }

        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
